name: Validate Prompt Catalog
on:
  push:
    paths:
      - 'app.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check desktop.js
      - run: node --check scripts/generate-icons.mjs
      - run: node scripts/prepare-desktop.mjs
      - run: node scripts/check-desktop.mjs
      - run: node scripts/validate-catalog.mjs
