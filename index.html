<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="画面に浮かぶ半透明のドーナツホイールで、AIプロンプトを選んで1クリックでコピーする。">
  <title>Kneekura Prompt Wheeler</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./desktop.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="widget" class="widget" data-view="ring">
    <button id="puck" class="puck" type="button" aria-label="ホイールを開く">
      <span id="puckIcon" class="puck-icon" aria-hidden="true">◉</span>
    </button>

    <div id="stage" class="stage" role="group" tabindex="0" aria-label="プロンプトホイール">
      <svg id="ring" class="ring" viewBox="-160 -160 320 320" aria-hidden="true"></svg>

      <button id="core" class="core" type="button">
        <span class="core-genre"><i aria-hidden="true"></i><b id="coreGenre">読み込み中</b><span id="coreCount"></span></span>
        <strong id="coreTitle" class="core-title">…</strong>
        <span class="core-hint">クリックでコピー</span>
        <span id="coreFlash" class="core-flash" aria-hidden="true"></span>
      </button>

      <div id="bubble" class="bubble" aria-hidden="true">
        <b id="bubbleTitle"></b>
        <p id="bubbleBody"></p>
        <span>クリックでコピー ・ ホイールで次へ</span>
      </div>

      <button id="btnMini" class="corner c-tl" type="button" title="小さく畳む（Esc）" aria-label="小さく畳む">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9"/></svg>
      </button>
      <button id="btnPin" class="corner c-tr" type="button" title="最前面に固定" aria-label="最前面に固定" aria-pressed="true" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10v4.5M4.5 10h7M6 2.5h4l-.6 4 2.1 3.5h-7l2.1-3.5z"/></svg>
      </button>
      <button id="btnList" class="corner c-br" type="button" title="一覧と検索（Ctrl+K）" aria-label="一覧と検索" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg>
      </button>
      <button id="btnFav" class="corner c-bl" type="button" title="お気に入り（F）" aria-label="お気に入りに追加" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2l1.8 3.7 4 .6-2.9 2.8.7 4L8 11.4l-3.6 1.9.7-4L2.2 6.5l4-.6z"/></svg>
      </button>
    </div>

    <div id="drawer" class="drawer" aria-label="プロンプト一覧">
      <div class="drawer-top">
        <input id="search" class="search" type="search" autocomplete="off" spellcheck="false" placeholder="全ジャンルから検索…" aria-label="全ジャンルから検索">
        <button id="favOnly" class="chip-btn" type="button" aria-pressed="false" title="お気に入りだけ表示">★</button>
        <button id="addPrompt" class="chip-btn" type="button" title="このジャンルにプロンプトを追加" aria-label="プロンプトを追加">＋</button>
      </div>
      <div id="list" class="list" role="list"></div>
      <div class="drawer-foot">
        <label class="slider">透過<input id="opacity" type="range" min="30" max="100" step="5" value="80" aria-label="待機時の不透明度"></label>
        <label class="slider">大きさ<input id="scale" type="range" min="70" max="160" step="10" value="100" aria-label="ホイールの大きさ"></label>
      </div>
    </div>
  </div>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
