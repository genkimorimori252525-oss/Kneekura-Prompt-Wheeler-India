[package]
name = "love-ai-donut"
version = "0.4.0"
description = "Love愛ドーナツ: a floating prompt wheel for the Windows desktop (native, no webview)"
authors = ["Kneekura"]
edition = "2021"

[dependencies]
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard"] }
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std"] }
memmap2 = "0.9"
winit = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
